[project]
name = "presnap"
version = "0.1.0"
description = "Pre-snap coverage, shell, rotation and blitz reads from NFL tracking data"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "nflreadpy>=0.1.5",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
train = [
    "torch>=2.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
